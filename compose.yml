# PPCAPP02: Claude subscription login with persistent SQLite memory.
# Portainer Git deployment: paulsperfectpc/claude-mem, main, compose.yml.
# Docker Standalone on Linux; create the external volumes once in Portainer.
services:
  claude-mem:
    build:
      context: .
      dockerfile: docker/claude-mem/Dockerfile
    image: ${CLAUDE_MEM_IMAGE:-claude-mem-server:13.28.0}
    pull_policy: build
    container_name: claude-mem-server
    restart: unless-stopped
    init: true
    # The official image defaults to the API-key/Postgres server.
    # Override its entrypoint to run the subscription-capable SQLite worker.
    entrypoint: ["bun", "/opt/claude-mem/scripts/worker-service.cjs"]
    command: ["--daemon"]
    ports:
      - "${CLAUDE_MEM_BIND_IP:-10.254.254.220}:37777:37777"
    networks:
      - claude_mem_net
    environment:
      HOME: /home/node
      CLAUDE_MEM_RUNTIME: worker
      CLAUDE_MEM_PROVIDER: claude
      CLAUDE_MEM_CLAUDE_AUTH_METHOD: subscription
      CLAUDE_MEM_DATA_DIR: /data/claude-mem
      CLAUDE_MEM_WORKER_HOST: "0.0.0.0"
      CLAUDE_MEM_WORKER_PORT: "37777"
      CLAUDE_CONFIG_DIR: /home/node/.claude
      CLAUDE_MEM_CLAUDE_CONFIG_DIR: /home/node/.claude
      CLAUDE_CODE_PATH: /usr/local/share/npm-global/bin/claude
      CLAUDE_MEM_CHROMA_ENABLED: "true"
      CLAUDE_MEM_CHROMA_MODE: local
    volumes:
      - memory-data:/data/claude-mem
      - subscription-home:/home/node
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:37777/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    stop_grace_period: 60s

networks:
  claude_mem_net:
    driver: bridge

# Stable, externally managed storage survives stack/container recreation.
# Do not delete these volumes. Keep separate backups of memory-data.
volumes:
  memory-data:
    external: true
    name: claude_mem_runtime
  subscription-home:
    external: true
    name: claude_mem_subscription_home
